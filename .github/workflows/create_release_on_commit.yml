name: Create GitHub Release on Commit

on:
  push:
    branches:
      - devtools-custom
  pull_request:
    branches:
      - devtools-custom

permissions:
  contents: write

jobs:
  verify_devtools_tests:
    name: Run react-devtools-custom tests
    if: github.event_name == 'pull_request' || github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Restore cached node_modules
        uses: actions/cache@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: runtime-node_modules-v7-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
        if: steps.node_modules.outputs.cache-hit != 'true'
      - name: Run react-devtools-custom Jest suite
        run: node ./scripts/jest/jest-cli.js --ci packages/react-devtools-custom/__tests__/index.test.js

  create_release:
    name: Create versioned release from package.json
    needs: verify_devtools_tests
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Restore cached node_modules
        uses: actions/cache@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: runtime-node_modules-v7-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
        if: steps.node_modules.outputs.cache-hit != 'true'
      - name: Build react-devtools-custom package
        run: yarn workspace react-devtools-custom build
      - name: Pack react-devtools-custom package
        id: pack_package
        run: |
          package_tgz=$(cd packages/react-devtools-custom && npm pack | tail -n 1)
          echo "asset_name=$package_tgz" >> "$GITHUB_OUTPUT"
          echo "asset_path=${GITHUB_WORKSPACE}/packages/react-devtools-custom/$package_tgz" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release and upload package tarball
        uses: actions/github-script@v7
        env:
          ASSET_NAME: ${{ steps.pack_package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.pack_package.outputs.asset_path }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha;
            const packagePath = path.join(
              process.env.GITHUB_WORKSPACE,
              'packages/react-devtools-custom/package.json'
            );

            if (!fs.existsSync(packagePath)) {
              throw new Error(`Could not read ${packagePath} from commit ${sha}.`);
            }

            const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));

            if (!packageJson.name || !packageJson.version) {
              throw new Error(
                `${packagePath} must include both "name" and "version".`
              );
            }

            const releaseName = `${packageJson.name}-v${packageJson.version}`;
            const tagName = releaseName;
            const tagRef = `refs/tags/${tagName}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${sha}`;
            const commitMessage = context.payload.head_commit?.message || '';
            const assetName = process.env.ASSET_NAME;
            const assetPath = process.env.ASSET_PATH;
            const releaseBody = [
              `Branch: ${branch}`,
              `Commit: ${sha}`,
              `Package: ${packageJson.name}`,
              `Version: ${packageJson.version}`,
              '',
              commitMessage,
              '',
              commitUrl,
            ].join('\n');

            if (!assetName || !assetPath || !fs.existsSync(assetPath)) {
              throw new Error(`Could not find package tarball to upload: ${assetPath || '(missing path)'}`);
            }

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: tagRef,
                sha,
              });
              core.info(`Created tag ${tagName} for ${sha}.`);
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              core.info(`Tag ${tagName} already exists; continuing.`);
            }

            let release;
            try {
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                target_commitish: sha,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
                make_latest: 'false',
              });
              core.info(`Created release ${tagName}.`);
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              core.info(`Release ${tagName} already exists; loading existing release.`);
              release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: tagName,
              });
            }

            const existingAsset = (release.data.assets || []).find(
              asset => asset.name === assetName
            );
            if (existingAsset) {
              core.info(`Asset ${assetName} already exists on release ${tagName}; skipping upload.`);
              return;
            }

            const assetBuffer = fs.readFileSync(assetPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: assetName,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': assetBuffer.length,
              },
              data: assetBuffer,
            });
            core.info(`Uploaded ${assetName} to release ${tagName}.`);
